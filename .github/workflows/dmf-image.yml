name: DMF image

# Builds Dockerfile.dmf, the mixer on go-mxl-runtime. Pull requests, to any
# base, build and smoke-test without publishing; main, dmf-v* tags and manual
# runs publish ghcr.io/qvest-digital/dmf-mf-mxl-audio-mixer.

on:
  push:
    branches:
      - main
    tags:
      - "dmf-v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/qvest-digital/dmf-mf-mxl-audio-mixer

jobs:
  # Outside pull requests the image is pushed by digest alone: the smoke test
  # runs that digest and the push job tags it, so a tag names exactly the
  # image that was tested.
  image:
    # A repository rename leaves this string behind, and a mismatch skips the
    # job silently rather than failing it.
    if: github.repository == 'qvest-digital/dmf-mf-mxl-audio-mixer'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dmf
          platforms: linux/amd64
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/dmf-v') && github.ref_name || github.sha }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=docker,name=mixer:smoke' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: '[[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest pushed: $DIGEST"; exit 1; }'
      - name: Pull the pushed image
        if: github.event_name != 'pull_request'
        run: |
          docker pull "$IMAGE@${{ steps.build.outputs.digest }}"
          docker tag "$IMAGE@${{ steps.build.outputs.digest }}" mixer:smoke
      # SYS_NICE puts the binary in secure-execution mode, where libmxl has to
      # resolve without LD_LIBRARY_PATH: the run checks that it does, that the
      # mixer writes a virtual output's flow through it. The NMOS address is
      # announced only, and the mixer refuses a loopback one.
      - name: Smoke test
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker run -d --name mixer --cap-add SYS_NICE --tmpfs /Volumes/mxl:mode=1777 \
            -p 8190:8190 -e NMOS_HOST_ADDRESS=192.0.2.10 -e MIXER_INPUT_FLOWS=2 \
            -e 'MIXER_OUTPUTS=[{"key":"pgm"}]' mixer:smoke
          trap 'docker logs mixer 2>&1 | tail -50; docker rm -f mixer >/dev/null' EXIT
          for _ in $(seq 60); do
            curl -fsS http://localhost:8190/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8190/readyz
          docker logs mixer 2>&1 | grep -q 'effective capabilities: sys_nice'
          flow=$(curl -fsS http://localhost:8190/api/v1/virtual-outputs | jq -er '.[0] | select(.running) | .mxl_flow_id')
          docker exec mixer sh -c "test -d /Volumes/mxl/*/$flow.mxl-flow"

  push:
    if: github.repository == 'qvest-digital/dmf-mf-mxl-audio-mixer' && github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: dmf-push-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Tag the tested image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          tags=("$IMAGE:${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF" == refs/tags/dmf-v* ]]; then
            tags+=("$IMAGE:${GITHUB_REF_NAME#dmf-v}")
          fi
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          for tag in "${tags[@]}"; do
            got=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            [[ "$got" == "$DIGEST" ]] || { echo "$tag is $got, want the tested $DIGEST"; exit 1; }
            echo "$tag -> $DIGEST"
          done
